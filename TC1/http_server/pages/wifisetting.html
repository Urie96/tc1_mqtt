<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
  <meta name="theme-color" content="#14352c">
  <title>TC1 配置</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #17211e;
      --muted: #65706c;
      --line: #d8dfdc;
      --surface: #ffffff;
      --page: #eef2f0;
      --brand: #14352c;
      --action: #087a61;
      --action-hover: #05634f;
      --focus: #007cba;
      --error: #b42318;
      --error-bg: #fef3f2;
      --success: #067647;
      --success-bg: #ecfdf3;
    }

    * { box-sizing: border-box; }

    html { min-height: 100%; }

    body {
      min-height: 100vh;
      margin: 0;
      color: var(--ink);
      background: var(--page);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      font-size: 16px;
      letter-spacing: 0;
    }

    header {
      min-height: 112px;
      padding: 26px 20px 24px;
      color: #ffffff;
      background: var(--brand);
    }

    .header-inner, main {
      width: min(100%, 620px);
      margin: 0 auto;
    }

    h1 {
      margin: 0;
      font-size: 28px;
      line-height: 1.2;
      font-weight: 700;
      letter-spacing: 0;
    }

    header p {
      margin: 7px 0 0;
      color: #cbd9d4;
      font-size: 14px;
      line-height: 1.5;
    }

    main {
      padding: 24px 20px 40px;
      background: var(--surface);
    }

    form { margin: 0; }

    fieldset {
      min-width: 0;
      margin: 0;
      padding: 0 0 26px;
      border: 0;
    }

    fieldset + fieldset {
      padding-top: 25px;
      border-top: 1px solid var(--line);
    }

    legend {
      width: 100%;
      margin: 0 0 17px;
      padding: 0;
      font-size: 17px;
      line-height: 1.4;
      font-weight: 650;
      letter-spacing: 0;
    }

    .field { margin-bottom: 17px; }
    .field:last-child { margin-bottom: 0; }

    label {
      display: block;
      margin-bottom: 7px;
      color: #34413d;
      font-size: 14px;
      line-height: 1.4;
      font-weight: 600;
    }

    input {
      width: 100%;
      height: 46px;
      padding: 10px 12px;
      color: var(--ink);
      background: #ffffff;
      border: 1px solid #aeb9b5;
      border-radius: 6px;
      outline: none;
      font: inherit;
      font-size: 16px;
      letter-spacing: 0;
    }

    input::placeholder { color: #89938f; }

    input:focus {
      border-color: var(--focus);
      box-shadow: 0 0 0 3px rgba(0, 124, 186, .14);
    }

    .row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 132px;
      gap: 14px;
    }

    .check {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      margin: 2px 0 0;
      color: #46534f;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
    }

    .check input {
      width: 18px;
      height: 18px;
      margin: 0;
      padding: 0;
      accent-color: var(--action);
      box-shadow: none;
    }

    .status {
      display: none;
      min-height: 48px;
      margin: 0 0 18px;
      padding: 12px 14px;
      border: 1px solid transparent;
      border-radius: 6px;
      font-size: 14px;
      line-height: 1.55;
    }

    .status.visible { display: block; }
    .status.error { color: var(--error); background: var(--error-bg); border-color: #fecdca; }
    .status.success { color: var(--success); background: var(--success-bg); border-color: #abefc6; }

    button {
      width: 100%;
      height: 48px;
      padding: 0 18px;
      color: #ffffff;
      background: var(--action);
      border: 0;
      border-radius: 6px;
      font: inherit;
      font-size: 16px;
      font-weight: 650;
      letter-spacing: 0;
      cursor: pointer;
    }

    button:hover { background: var(--action-hover); }
    button:focus-visible { outline: 3px solid rgba(0, 124, 186, .28); outline-offset: 2px; }
    button:disabled { background: #7f918b; cursor: wait; }

    @media (min-width: 660px) {
      body { padding-bottom: 48px; }
      header { min-height: 128px; padding-top: 32px; }
      main { margin-top: 24px; padding: 30px 34px 34px; border: 1px solid var(--line); border-radius: 8px; }
    }

    @media (max-width: 430px) {
      .row { grid-template-columns: 1fr; gap: 0; }
    }
  </style>
</head>
<body>
  <header>
    <div class="header-inner">
      <h1>TC1 配置</h1>
      <p>配置 Wi-Fi 与 MQTT 服务</p>
    </div>
  </header>

  <main>
    <form id="config-form" novalidate>
      <fieldset>
        <legend>无线网络</legend>
        <div class="field">
          <label for="ssid">Wi-Fi 名称</label>
          <input id="ssid" name="ssid" type="text" maxlength="31" autocomplete="off" required>
        </div>
        <div class="field">
          <label for="wifi-password">Wi-Fi 密码</label>
          <input id="wifi-password" name="wifi_password" type="password" maxlength="63" autocomplete="new-password">
        </div>
      </fieldset>

      <fieldset>
        <legend>MQTT 服务</legend>
        <div class="row">
          <div class="field">
            <label for="mqtt-host">服务器地址</label>
            <input id="mqtt-host" name="mqtt_host" type="text" maxlength="63" placeholder="IP 地址或域名" autocapitalize="none" spellcheck="false" required>
          </div>
          <div class="field">
            <label for="mqtt-port">端口</label>
            <input id="mqtt-port" name="mqtt_port" type="number" value="1883" min="1" max="65535" inputmode="numeric" required>
          </div>
        </div>
        <div class="field">
          <label for="mqtt-username">用户名</label>
          <input id="mqtt-username" name="mqtt_username" type="text" maxlength="63" autocapitalize="none" autocomplete="off" spellcheck="false">
        </div>
        <div class="field">
          <label for="mqtt-password">密码</label>
          <input id="mqtt-password" name="mqtt_password" type="password" maxlength="63" autocomplete="new-password">
        </div>
        <label class="check" for="show-passwords">
          <input id="show-passwords" type="checkbox">
          <span>显示密码</span>
        </label>
      </fieldset>

      <div id="status" class="status" role="status" aria-live="polite"></div>
      <button id="save" type="submit">保存配置</button>
    </form>
  </main>

  <script>
    (function () {
      var form = document.getElementById('config-form');
      var save = document.getElementById('save');
      var status = document.getElementById('status');
      var showPasswords = document.getElementById('show-passwords');
      var wifiPassword = document.getElementById('wifi-password');
      var mqttPassword = document.getElementById('mqtt-password');
      var messages = {
        invalid_json: '请求格式无效，请重新提交。',
        invalid_ssid: '请输入有效的 Wi-Fi 名称。',
        invalid_wifi_password: 'Wi-Fi 密码过长。',
        invalid_mqtt_host: '请输入有效的 MQTT 服务器地址。',
        invalid_mqtt_port: 'MQTT 端口必须在 1 到 65535 之间。',
        invalid_mqtt_username: 'MQTT 用户名过长。',
        invalid_mqtt_password: 'MQTT 密码过长。',
        request_too_large: '配置内容过长，请缩短输入内容。',
        save_failed: '配置保存失败，请重试。'
      };

      function setStatus(type, text) {
        status.className = 'status visible ' + type;
        status.textContent = text;
      }

      showPasswords.addEventListener('change', function () {
        var type = showPasswords.checked ? 'text' : 'password';
        wifiPassword.type = type;
        mqttPassword.type = type;
      });

      form.addEventListener('submit', function (event) {
        event.preventDefault();
        status.className = 'status';

        if (!form.checkValidity()) {
          form.reportValidity();
          return;
        }

        var config = {
          ssid: document.getElementById('ssid').value,
          wifi_password: wifiPassword.value,
          mqtt_host: document.getElementById('mqtt-host').value,
          mqtt_port: Number(document.getElementById('mqtt-port').value),
          mqtt_username: document.getElementById('mqtt-username').value,
          mqtt_password: mqttPassword.value
        };
        var body = JSON.stringify(config);

        if (new Blob([body]).size >= 510) {
          setStatus('error', messages.request_too_large);
          return;
        }

        save.disabled = true;
        save.textContent = '正在保存...';

        fetch('/api/config', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: body
        }).then(function (response) {
          return response.json().then(function (data) {
            if (!response.ok || !data.success) {
              throw new Error(data.error || 'save_failed');
            }
            return data;
          });
        }).then(function () {
          setStatus('success', '配置已保存。设备正在重启并连接网络。');
          save.textContent = '已保存';
        }).catch(function (error) {
          setStatus('error', messages[error.message] || '无法连接设备，请确认仍连接到 TC1 配置网络后重试。');
          save.disabled = false;
          save.textContent = '保存配置';
        });
      });
    }());
  </script>
</body>
</html>
