<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
  <meta name="theme-color" content="#14352c">
  <title>TC1 控制面板</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #17211e;
      --muted: #65706c;
      --line: #d8dfdc;
      --surface: #ffffff;
      --page: #eef2f0;
      --brand: #14352c;
      --action: #087a61;
      --action-hover: #05634f;
      --danger: #b42318;
      --danger-hover: #8a1c12;
      --focus: #007cba;
      --error: #b42318;
      --error-bg: #fef3f2;
      --success: #067647;
      --success-bg: #ecfdf3;
      --on: #087a61;
      --off: #98a6a1;
    }

    * { box-sizing: border-box; }

    html { min-height: 100%; }

    body {
      min-height: 100vh;
      margin: 0;
      color: var(--ink);
      background: var(--page);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      font-size: 16px;
      letter-spacing: 0;
    }

    header {
      min-height: 112px;
      padding: 26px 20px 24px;
      color: #ffffff;
      background: var(--brand);
    }

    .header-inner, main {
      width: min(100%, 620px);
      margin: 0 auto;
    }

    h1 {
      margin: 0;
      font-size: 28px;
      line-height: 1.2;
      font-weight: 700;
      letter-spacing: 0;
    }

    header p {
      margin: 7px 0 0;
      color: #cbd9d4;
      font-size: 14px;
      line-height: 1.5;
    }

    main {
      padding: 24px 20px 40px;
      background: var(--surface);
    }

    section {
      min-width: 0;
      margin: 0;
      padding: 0 0 26px;
      border: 0;
    }

    section + section {
      padding-top: 25px;
      border-top: 1px solid var(--line);
    }

    .section-title {
      width: 100%;
      margin: 0 0 17px;
      padding: 0;
      font-size: 17px;
      line-height: 1.4;
      font-weight: 650;
      letter-spacing: 0;
    }

    .field { margin-bottom: 17px; }
    .field:last-child { margin-bottom: 0; }

    label {
      display: block;
      margin-bottom: 7px;
      color: #34413d;
      font-size: 14px;
      line-height: 1.4;
      font-weight: 600;
    }

    input {
      width: 100%;
      height: 46px;
      padding: 10px 12px;
      color: var(--ink);
      background: #ffffff;
      border: 1px solid #aeb9b5;
      border-radius: 6px;
      outline: none;
      font: inherit;
      font-size: 16px;
      letter-spacing: 0;
    }

    input::placeholder { color: #89938f; }

    input:focus {
      border-color: var(--focus);
      box-shadow: 0 0 0 3px rgba(0, 124, 186, .14);
    }

    input[readonly] {
      background: #f4f6f5;
      color: var(--muted);
      cursor: default;
    }

    .row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 132px;
      gap: 14px;
    }

    .check {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      margin: 2px 0 0;
      color: #46534f;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
    }

    .check input {
      width: 18px;
      height: 18px;
      margin: 0;
      padding: 0;
      accent-color: var(--action);
      box-shadow: none;
    }

    /* ── Info grid ── */
    .info-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px 22px;
    }
    .info-item { }
    .info-item .label {
      font-size: 12px;
      color: var(--muted);
      font-weight: 600;
      letter-spacing: .3px;
      text-transform: uppercase;
    }
    .info-item .value {
      margin-top: 2px;
      font-size: 15px;
      font-weight: 500;
      word-break: break-all;
    }

    /* ── Relay switches ── */
    .relay-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 12px;
    }

    .relay-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 70px;
      border-radius: 8px;
      border: 2px solid var(--line);
      background: var(--surface);
      cursor: pointer;
      font: inherit;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0;
      transition: background .15s, border-color .15s, color .15s;
      -webkit-tap-highlight-color: transparent;
    }
    .relay-btn .slot-label {
      font-size: 11px;
      opacity: .6;
      margin-bottom: 3px;
    }
    .relay-btn .slot-state {
      font-size: 15px;
    }
    .relay-btn.on {
      background: #e8f8f3;
      border-color: var(--on);
      color: var(--on);
    }
    .relay-btn.off {
      background: #f4f6f5;
      border-color: var(--line);
      color: var(--off);
    }
    .relay-btn:disabled {
      opacity: .55;
      cursor: wait;
    }

    /* ── Status message ── */
    .status {
      display: none;
      min-height: 48px;
      margin: 0 0 18px;
      padding: 12px 14px;
      border: 1px solid transparent;
      border-radius: 6px;
      font-size: 14px;
      line-height: 1.55;
    }

    .status.visible { display: block; }
    .status.error { color: var(--error); background: var(--error-bg); border-color: #fecdca; }
    .status.success { color: var(--success); background: var(--success-bg); border-color: #abefc6; }

    /* ── Buttons ── */
    .btn-row {
      display: flex;
      gap: 12px;
    }
    .btn-row button { flex: 1; }

    button {
      height: 48px;
      padding: 0 18px;
      color: #ffffff;
      background: var(--action);
      border: 0;
      border-radius: 6px;
      font: inherit;
      font-size: 16px;
      font-weight: 650;
      letter-spacing: 0;
      cursor: pointer;
      transition: background .15s;
    }

    button:hover { background: var(--action-hover); }
    button:focus-visible { outline: 3px solid rgba(0, 124, 186, .28); outline-offset: 2px; }
    button:disabled { background: #7f918b; cursor: wait; }

    button.danger { background: var(--danger); }
    button.danger:hover { background: var(--danger-hover); }
    button.danger:disabled { background: #b07a74; }

    /* ── Loader ── */
    .loader {
      text-align: center;
      padding: 48px 20px;
      color: var(--muted);
      font-size: 15px;
    }

    @media (min-width: 660px) {
      body { padding-bottom: 48px; }
      header { min-height: 128px; padding-top: 32px; }
      main { margin-top: 24px; padding: 30px 34px 34px; border: 1px solid var(--line); border-radius: 8px; }
    }

    @media (max-width: 430px) {
      .row { grid-template-columns: 1fr; gap: 0; }
      .relay-grid { grid-template-columns: 1fr 1fr; }
      .info-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header>
    <div class="header-inner">
      <h1>TC1 控制面板</h1>
      <p id="header-sub">加载中…</p>
    </div>
  </header>

  <main id="main-content" style="display:none">
    <!-- ═══ 状态信息 ═══ -->
    <section>
      <div class="section-title">设备信息</div>
      <div class="info-grid" id="info-grid"></div>
    </section>

    <!-- ═══ 开关控制 ═══ -->
    <section>
      <div class="section-title">插座控制</div>
      <div class="relay-grid" id="relay-grid"></div>
    </section>

    <!-- ═══ 无线网络 ═══ -->
    <section>
      <div class="section-title">无线网络</div>
      <div class="field">
        <label for="ssid">Wi-Fi 名称</label>
        <input id="ssid" type="text" maxlength="31" autocomplete="off">
      </div>
      <div class="field">
        <label for="wifi-password">Wi-Fi 密码</label>
        <input id="wifi-password" type="password" maxlength="63" autocomplete="new-password">
      </div>
    </section>

    <!-- ═══ MQTT 服务 ═══ -->
    <section>
      <div class="section-title">MQTT 服务</div>
      <div class="row">
        <div class="field">
          <label for="mqtt-host">服务器地址</label>
          <input id="mqtt-host" type="text" maxlength="63" placeholder="IP 地址或域名" autocapitalize="none" spellcheck="false">
        </div>
        <div class="field">
          <label for="mqtt-port">端口</label>
          <input id="mqtt-port" type="number" value="1883" min="1" max="65535" inputmode="numeric">
        </div>
      </div>
      <div class="field">
        <label for="mqtt-username">用户名</label>
        <input id="mqtt-username" type="text" maxlength="63" autocapitalize="none" autocomplete="off" spellcheck="false">
      </div>
      <div class="field">
        <label for="mqtt-password">密码</label>
        <input id="mqtt-password" type="password" maxlength="63" autocomplete="new-password">
      </div>
      <label class="check" for="show-passwords">
        <input id="show-passwords" type="checkbox">
        <span>显示密码</span>
      </label>
    </section>

    <!-- ═══ OTA 升级 ═══ -->
    <section>
      <div class="section-title">OTA 升级</div>
      <div class="field">
        <label for="ota-url">固件下载地址</label>
        <input id="ota-url" type="url" maxlength="127" placeholder="http://example.com/firmware.bin" autocapitalize="none" spellcheck="false">
      </div>
      <div class="field">
        <label for="ota-md5">MD5（可选）</label>
        <input id="ota-md5" type="text" maxlength="32" placeholder="32 位十六进制字符串" autocapitalize="none" spellcheck="false">
      </div>
      <button id="ota-btn" class="danger">开始升级</button>
    </section>

    <!-- ═══ 操作按钮 ═══ -->
    <div id="status" class="status" role="status" aria-live="polite"></div>
    <div class="btn-row">
      <button id="save-btn">保存配置</button>
      <button id="reboot-btn" class="danger">重启设备</button>
    </div>
  </main>

  <div id="loader" class="loader">加载配置中…</div>

  <script>
    (function () {
      'use strict';

      /* ---- DOM refs ---- */
      var loader = document.getElementById('loader');
      var mainEl = document.getElementById('main-content');
      var headerSub = document.getElementById('header-sub');
      var infoGrid = document.getElementById('info-grid');
      var relayGrid = document.getElementById('relay-grid');
      var statusEl = document.getElementById('status');
      var saveBtn = document.getElementById('save-btn');
      var rebootBtn = document.getElementById('reboot-btn');
      var showPass = document.getElementById('show-passwords');

      var ssidEl = document.getElementById('ssid');
      var wifiPassEl = document.getElementById('wifi-password');
      var hostEl = document.getElementById('mqtt-host');
      var portEl = document.getElementById('mqtt-port');
      var userEl = document.getElementById('mqtt-username');
      var mqttPassEl = document.getElementById('mqtt-password');
      var otaUrlEl = document.getElementById('ota-url');
      var otaMd5El = document.getElementById('ota-md5');
      var otaBtn = document.getElementById('ota-btn');

      /* ---- helpers ---- */
      function setStatus(type, text) {
        statusEl.className = 'status visible ' + (type || '');
        statusEl.textContent = text || '';
      }
      function clearStatus() {
        statusEl.className = 'status';
        statusEl.textContent = '';
      }

      function buildInfoGrid(data) {
        var items = [
          { label: '设备名称', value: data.name || '-' },
          { label: '固件版本', value: data.version || '-' },
          { label: 'MAC 地址', value: data.mac || '-' },
          { label: 'IP 地址',  value: data.ip || '-' },
          { label: '当前功率', value: data.power || '0.0' },
        ];
        infoGrid.innerHTML = items.map(function (it) {
          return '<div class="info-item"><div class="label">' + it.label +
                 '</div><div class="value">' + escapeHtml(it.value) + '</div></div>';
        }).join('');
        headerSub.textContent = data.name ? '设备名称: ' + data.name : '已连接';
      }

      function escapeHtml(s) {
        var d = document.createElement('div');
        d.appendChild(document.createTextNode(s));
        return d.innerHTML;
      }

      /* ---- Relay buttons ---- */
      function renderRelays(data) {
        var html = '';
        for (var i = 0; i < 6; i++) {
          var key = 'slot' + i;
          var state = (data[key] !== undefined) ? data[key] : 0;
          var onClass = state ? 'on' : 'off';
          var label = state ? '开' : '关';
          html += '<button class="relay-btn ' + onClass + '" data-slot="' + i +
                  '" data-state="' + state + '">' +
                  '<span class="slot-label">插座 ' + (i + 1) + '</span>' +
                  '<span class="slot-state">' + label + '</span>' +
                  '</button>';
        }
        relayGrid.innerHTML = html;

        /* attach click handlers */
        Array.prototype.forEach.call(relayGrid.querySelectorAll('.relay-btn'), function (btn) {
          btn.addEventListener('click', function () {
            var slot = parseInt(btn.getAttribute('data-slot'), 10);
            var curState = parseInt(btn.getAttribute('data-state'), 10);
            toggleRelay(slot, curState ? 0 : 1);
          });
        });
      }

      function updateRelayBtn(slot, state) {
        var btns = relayGrid.querySelectorAll('.relay-btn');
        for (var i = 0; i < btns.length; i++) {
          if (parseInt(btns[i].getAttribute('data-slot'), 10) === slot) {
            var btn = btns[i];
            btn.className = 'relay-btn ' + (state ? 'on' : 'off');
            btn.setAttribute('data-state', state);
            btn.querySelector('.slot-state').textContent = state ? '开' : '关';
            break;
          }
        }
      }

      function toggleRelay(slot, newState) {
        var body = {};
        body['slot' + slot] = newState;
        var raw = JSON.stringify(body);
        disableAll(true);
        clearStatus();

        fetch('/api/relay', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: raw
        }).then(function (r) {
          if (!r.ok) throw new Error('http_error');
          return r.json();
        }).then(function (data) {
          renderRelays(data);
          disableAll(false);
        }).catch(function () {
          setStatus('error', '开关控制失败，请重试。');
          disableAll(false);
        });
      }

      /* ---- Load config & relay state ---- */
      function loadAll() {
        clearStatus();
        fetch('/api/config', { method: 'GET' }).then(function (r) {
          if (!r.ok) throw new Error('load_failed');
          return r.json();
        }).then(function (data) {
          /* Populate info */
          buildInfoGrid(data);

          /* Populate relay buttons */
          renderRelays(data);

          /* Populate form fields */
          ssidEl.value = data.ssid || '';
          wifiPassEl.value = '';
          hostEl.value = data.mqtt_ip || '';
          portEl.value = data.mqtt_port || 1883;
          userEl.value = data.mqtt_user || '';
          mqttPassEl.value = '';
          otaUrlEl.value = data.ota_url || '';
          otaMd5El.value = data.ota_md5 || '';

          /* Show main content */
          loader.style.display = 'none';
          mainEl.style.display = 'block';
        }).catch(function () {
          loader.textContent = '无法加载配置，请确认设备已连接。';
        });
      }

      /* ---- Save config ---- */
      /* ---- OTA ---- */
      function startOta() {
        if (!confirm('确定要开始 OTA 升级吗？设备将下载固件并重启。')) return;
        clearStatus();
        disableAll(true);
        otaBtn.textContent = '升级中…';

        var body = {
          url: otaUrlEl.value || undefined,
          md5: otaMd5El.value || undefined
        };

        fetch('/api/ota', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        }).then(function (r) {
          if (!r.ok) throw new Error('ota_failed');
          return r.json();
        }).then(function (data) {
          if (!data.success) throw new Error('ota_failed');
          setStatus('success', 'OTA 已启动，设备正在下载固件…');
        }).catch(function () {
          setStatus('error', 'OTA 启动失败，请检查 URL 后重试。');
          otaBtn.textContent = '开始升级';
          disableAll(false);
        });
      }

      function saveConfig() {
        clearStatus();

        var config = {
          ssid: ssidEl.value,
          wifi_password: wifiPassEl.value,
          mqtt_host: hostEl.value,
          mqtt_port: Number(portEl.value),
          mqtt_username: userEl.value,
          mqtt_password: mqttPassEl.value,
          ota_url: otaUrlEl.value,
          ota_md5: otaMd5El.value
        };

        /* Remove empty passwords so they don't overwrite with blank */
        if (!config.wifi_password) delete config.wifi_password;
        if (!config.mqtt_password) delete config.mqtt_password;

        var body = JSON.stringify(config);
        if (new Blob([body]).size >= 1020) {
          setStatus('error', '配置内容过长，请缩短输入内容。');
          return;
        }

        disableAll(true);
        saveBtn.textContent = '正在保存…';

        fetch('/api/config', {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: body
        }).then(function (r) { return r.json(); }).then(function (data) {
          if (!data.success) throw new Error(data.error || 'save_failed');
          setStatus('success', '配置已保存，重启后生效。');
          saveBtn.textContent = '保存配置';
          disableAll(false);
        }).catch(function (err) {
          setStatus('error', '配置保存失败，请重试。');
          saveBtn.textContent = '保存配置';
          disableAll(false);
        });
      }

      /* ---- Reboot ---- */
      function rebootDevice() {
        if (!confirm('确定要重启设备吗？')) return;
        clearStatus();
        disableAll(true);
        rebootBtn.textContent = '正在重启…';

        fetch('/api/reboot', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' }
        }).then(function (r) {
          if (!r.ok) throw new Error('reboot_failed');
          return r.json();
        }).then(function (data) {
          if (!data.success) throw new Error('reboot_failed');
          /* Response received — reboot is imminent */
          setStatus('success', '设备正在重启…');
        }).catch(function () {
          /* Connection may drop during reboot; treat network error as expected */
          setStatus('success', '设备正在重启…');
        });
      }

      function disableAll(disabled) {
        var buttons = mainEl.querySelectorAll('button');
        for (var i = 0; i < buttons.length; i++) {
          buttons[i].disabled = disabled;
        }
      }

      /* ---- Event listeners ---- */
      showPass.addEventListener('change', function () {
        var type = showPass.checked ? 'text' : 'password';
        wifiPassEl.type = type;
        mqttPassEl.type = type;
      });

      saveBtn.addEventListener('click', saveConfig);
      rebootBtn.addEventListener('click', rebootDevice);
      otaBtn.addEventListener('click', startOta);

      /* ---- Init ---- */
      loadAll();
    }());
  </script>
</body>
</html>
